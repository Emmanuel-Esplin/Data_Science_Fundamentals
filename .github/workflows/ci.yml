name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Run notebooks and audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Execute every notebook top to bottom
        working-directory: notebooks
        env:
          MPLBACKEND: Agg
        run: |
          for nb in *.ipynb; do
            jupyter nbconvert --to notebook --execute --output "/tmp/$nb" "$nb"
          done
