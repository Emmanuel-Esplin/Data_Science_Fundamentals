# Local checks before each commit. Set up once with:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks              # block API keys, tokens and passwords

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-yaml
      # Formatting fixers skip the datasets and notebook outputs so they are never rewritten
      - id: end-of-file-fixer
        exclude: ^(data/|notebooks/)
      - id: trailing-whitespace
        exclude: ^(data/|notebooks/)
